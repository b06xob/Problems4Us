# Unattended alert evaluation (problems4us-10b)
# Runs without manual admin forceDelta; emits score-change AlertEvents when watches move.

name: Scheduled alert evaluation

on:
  schedule:
    # Every 6 hours UTC
    - cron: "15 */6 * * *"
  workflow_dispatch:

jobs:
  evaluate-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: POST admin alert evaluate (no forceDelta)
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          ALERTS_EVALUATE_URL: https://problems4us.com/api/admin/alerts/evaluate
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_API_KEY:-}" ]; then
            echo "ADMIN_API_KEY secret missing — cannot evaluate unattended"
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/alerts-eval.json -w "%{http_code}" \
            -X POST "$ALERTS_EVALUATE_URL" \
            -H "x-admin-api-key: ${ADMIN_API_KEY}" \
            -H "content-type: application/json" \
            -d '{}')
          echo "HTTP ${CODE}"
          cat /tmp/alerts-eval.json
          test "$CODE" = "200"
