# Scheduled daily ingest → score (problems4us-11e)

# Live POST to GitHub Issues + Hacker News admin ingest (AI extract on write).
# Reddit removed entirely per Founder directive 2026-08-02 (cos-remove-reddit-20260802).
# Failure must escalate Warning+ to Passport (ops-runbook-admin-ingest.md).

name: Scheduled daily ingest

on:
  schedule:
    # Daily 06:20 UTC
    - cron: "20 6 * * *"
  workflow_dispatch:

jobs:
  daily-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest watched sources (GitHub + Hacker News)
        id: ingest
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          GITHUB_INGEST_URL: https://problems4us.com/api/ingest/github
          HN_INGEST_URL: https://problems4us.com/api/ingest/hackernews
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_API_KEY:-}" ]; then
            echo "ADMIN_API_KEY secret missing — cannot ingest unattended"
            echo "::error::problems4us-11e: ADMIN_API_KEY missing — escalate Warning+ to Passport"
            exit 1
          fi

          ok=0
          attempted=0
          mkdir -p /tmp/p4u-ingest
          RUN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DAY=$(date -u +%Y-%m-%d)

          attempt() {
            local name="$1"
            local url="$2"
            local body="$3"
            attempted=$((attempted + 1))
            echo "=== ${name} ==="
            CODE=$(curl -sS -o "/tmp/p4u-ingest/${name}.json" -w "%{http_code}" \
              -X POST "$url" \
              -H "x-admin-api-key: ${ADMIN_API_KEY}" \
              -H "content-type: application/json" \
              -d "$body" || true)
            echo "HTTP ${CODE}"
            cat "/tmp/p4u-ingest/${name}.json" || true
            echo
            if [ "$CODE" = "200" ]; then
              ok=$((ok + 1))
              echo "${name}=ok" >> /tmp/p4u-ingest/sources.env
              return 0
            fi
            echo "${name}: hard-fail HTTP ${CODE}"
            echo "${name}=hard_fail_${CODE}" >> /tmp/p4u-ingest/sources.env
            return 1
          }

          attempt github "$GITHUB_INGEST_URL" '{"repo":"Azure/azure-cli","perPage":10,"dryRun":false}' || true
          attempt hackernews "$HN_INGEST_URL" '{"hitsPerPage":10,"dryRun":false}' || true

          RATE_PCT=0
          if [ "$attempted" -gt 0 ]; then
            RATE_PCT=$(( ok * 100 / attempted ))
          fi
          if [ "$ok" -ge 2 ]; then PASSED=true; else PASSED=false; fi
          export RUN_AT DAY RATE_PCT PASSED
          export OK_COUNT="$ok" ATTEMPTED="$attempted"

          python3 - <<'PY'
          import json, os
          sources = {}
          env_path = "/tmp/p4u-ingest/sources.env"
          if os.path.exists(env_path):
            for line in open(env_path, encoding="utf-8"):
              line = line.strip()
              if "=" in line:
                k, v = line.split("=", 1)
                sources[k] = v
          receipt = {
            "stepId": "problems4us-11e",
            "runAtUtc": os.environ.get("RUN_AT", ""),
            "calendarDayUtc": os.environ.get("DAY", ""),
            "ok": int(os.environ.get("OK_COUNT", "0")),
            "attempted": int(os.environ.get("ATTEMPTED", "0")),
            "successRatePct": int(os.environ.get("RATE_PCT", "0")),
            "thresholdPct": 60,
            "passed": os.environ.get("PASSED", "false") == "true",
            "sources": sources,
            "githubRunId": os.environ.get("GITHUB_RUN_ID", ""),
            "githubRunUrl": "https://github.com/%s/actions/runs/%s" % (
              os.environ.get("GITHUB_REPOSITORY", "b06xob/Problems4Us"),
              os.environ.get("GITHUB_RUN_ID", "0"),
            ),
            "note": "Watched sources: GitHub Issues + Hacker News (Reddit removed 2026-08-02).",
          }
          open("/tmp/p4u-ingest/receipt.json", "w", encoding="utf-8").write(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2))
          PY

          echo "ok=${ok} attempted=${attempted} successRatePct=${RATE_PCT}"

          # Success when both watched sources succeed (100% of attempted).
          if [ "$ok" -ge 2 ]; then
            echo "daily ingest success rate >=60% this run"
            exit 0
          fi
          echo "::error::problems4us-11e FAILED — success below 60% (ok=${ok}/${attempted}). Escalate Warning+ to Passport per ops-runbook-admin-ingest.md."
          echo "daily ingest failed: insufficient source successes"
          exit 1

      - name: Post Passport-readable ledger receipt
        if: always()
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_API_KEY:-}" ]; then
            echo "::warning::ADMIN_API_KEY missing — cannot POST ledger receipt"
            exit 0
          fi
          if [ ! -f /tmp/p4u-ingest/receipt.json ]; then
            echo "No receipt.json — skip ledger POST"
            exit 0
          fi
          # Enrich with GITHUB_RUN_* then POST to prod admin ledger (problems4us-11e).
          python3 - <<'PY'
          import json, os, urllib.request
          receipt = json.load(open("/tmp/p4u-ingest/receipt.json", encoding="utf-8"))
          receipt["githubRunId"] = os.environ.get("GITHUB_RUN_ID", receipt.get("githubRunId", ""))
          receipt["githubRunUrl"] = "https://github.com/%s/actions/runs/%s" % (
              os.environ.get("GITHUB_REPOSITORY", "b06xob/Problems4Us"),
              os.environ.get("GITHUB_RUN_ID", "0"),
          )
          body = json.dumps(receipt).encode("utf-8")
          req = urllib.request.Request(
              "https://problems4us.com/api/admin/ingest-daily",
              data=body,
              method="POST",
              headers={
                  "content-type": "application/json",
                  "x-admin-api-key": os.environ["ADMIN_API_KEY"],
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(resp.status, resp.read().decode("utf-8", errors="replace")[:2000])
          except Exception as exc:
              # Ledger post must not hide ingest outcome; warn loudly for Audi/Passport.
              print("::warning::problems4us-11e ledger POST failed:", exc)
              raise SystemExit(0)
          PY

      - name: Upload ingest receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problems4us-11e-ingest-receipt
          path: /tmp/p4u-ingest/
          if-no-files-found: warn
          retention-days: 30
