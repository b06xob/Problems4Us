name: Build and Deploy to Azure App Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AZURE_WEBAPP_NAME: problems4us-linux
  AZURE_RESOURCE_GROUP: rg-problems4us
  NODE_VERSION: "22.x"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Compute deploy version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DEPLOY_DATE="$(date -u +%Y.%m.%d)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="v${DEPLOY_DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "deployed_at=${DEPLOYED_AT}" >> "$GITHUB_OUTPUT"
          echo "Computed site version ${VERSION} (commit ${GITHUB_SHA})"

      - name: Build application
        run: npm run build
        env:
          AI_PROVIDER: mock
          NEXT_PUBLIC_APP_URL: https://problems4us.com
          NEXT_PUBLIC_APP_NAME: Problems4Us
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
          NEXT_PUBLIC_GIT_COMMIT: ${{ steps.version.outputs.commit }}
          NEXT_PUBLIC_DEPLOYED_AT: ${{ steps.version.outputs.deployed_at }}

      - name: Prepare standalone deployment package
        run: |
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/public
          cp -r public/* .next/standalone/public/ 2>/dev/null || true
          cd .next/standalone && zip -r ../../deploy.zip . && cd ../..

      - name: Login to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            --output none
          az webapp deploy \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path deploy.zip \
            --type zip \
            --clean true \
            --restart true \
            --timeout 900

      # problems4us-17c: post-deploy smoke — health + public + admin fail-closed
      - name: Post-deploy smoke (health + public + admin-fail)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_BASE: https://problems4us.com
        run: |
          set -euo pipefail
          echo "Waiting for App Service warmup..."
          sleep 45

          fail=0
          check() {
            local name="$1" url="$2" expect="$3"
            code=$(curl -sS -o /tmp/smoke-body.json -w "%{http_code}" "$url" || echo "000")
            echo "${name}: HTTP ${code} (expect ${expect})"
            head -c 400 /tmp/smoke-body.json || true
            echo
            if [ "$code" != "$expect" ]; then
              echo "SMOKE FAIL: ${name}"
              fail=1
            fi
          }

          check "health" "${SMOKE_BASE}/api/health" "200"
          check "public-pricing" "${SMOKE_BASE}/pricing" "200"
          # Admin without key must fail closed (401 or 503) — never 200
          admin_code=$(curl -sS -o /tmp/smoke-admin.json -w "%{http_code}" \
            "${SMOKE_BASE}/api/sources" || echo "000")
          echo "admin-fail: HTTP ${admin_code} (expect 401 or 503)"
          head -c 400 /tmp/smoke-admin.json || true
          echo
          if [ "$admin_code" != "401" ] && [ "$admin_code" != "503" ]; then
            echo "SMOKE FAIL: admin-fail expected 401/503"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Post-deploy smoke FAILED — do not treat this ship as green"
            exit 1
          fi
          echo "Post-deploy smoke PASSED"

